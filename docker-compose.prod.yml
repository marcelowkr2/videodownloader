services:
  web:
    build: .
    restart: unless-stopped
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.middlewares.videodownloader-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.videodownloader-redirect.redirectscheme.permanent=true
      - traefik.http.routers.videodownloader-http.entrypoints=web
      - traefik.http.routers.videodownloader-http.rule=Host(`videodownloader.infosystema.cloud`)
      - traefik.http.routers.videodownloader-http.middlewares=videodownloader-redirect
      - traefik.http.routers.videodownloader-web.entrypoints=websecure
      - traefik.http.routers.videodownloader-web.rule=Host(`videodownloader.infosystema.cloud`)
      - traefik.http.routers.videodownloader-web.tls.certresolver=letsencrypt
      - traefik.http.services.videodownloader-web.loadbalancer.server.port=80

networks:
  dokploy-network:
    external: true
